<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <title>USD - THB</title>  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>  <style>    :root {      --bg: #06080b;      --surface: rgba(18, 23, 29, 0.75);      --surface-2: rgba(25, 31, 39, 0.85);      --border: rgba(255, 255, 255, 0.12);      --text: #f4f7f8;      --muted: #8b949e;      --accent: #71ead3;      --accent-2: #62a8ff;      --danger: #fb7185;    }    * {      box-sizing: border-box;    }    body {      margin: 0;      min-height: 100vh;      padding: 18px;      display: flex;      justify-content: center;      align-items: center;      background:        radial-gradient(          circle at 20% 0%,          rgba(113, 234, 211, 0.18),          transparent 45%        ),        radial-gradient(          circle at 80% 100%,          rgba(98, 168, 255, 0.18),          transparent 45%        ),        radial-gradient(          circle at 50% 50%,          rgba(18, 23, 29, 0.5),          var(--bg)        );      color: var(--text);      font-family:        Inter, ui-sans-serif, system-ui, -apple-system,        BlinkMacSystemFont, "Segoe UI", sans-serif;    }    .app {      width: 100%;      max-width: 430px;    }    .header {      display: flex;      align-items: center;      justify-content: space-between;      margin-bottom: 16px;    }    .brand {      display: flex;      align-items: center;      gap: 11px;    }    .brand-mark {      width: 40px;      height: 40px;      display: grid;      place-items: center;      border-radius: 13px;      color: #061412;      font-size: 20px;      font-weight: 800;      background:        linear-gradient(135deg, var(--accent), var(--accent-2));      box-shadow: 0 0 28px rgba(113, 234, 211, 0.35);    }    h1 {      margin: 0;      font-size: 16px;      font-weight: 700;      letter-spacing: -0.3px;    }    .subtitle {      margin: 3px 0 0;      color: var(--muted);      font-size: 11px;    }    .date {      color: var(--muted);      font-size: 11px;    }    .hero {      position: relative;      overflow: hidden;      padding: 26px 22px 21px;      border: 1px solid var(--border);      border-radius: 25px;      background:        linear-gradient(          145deg,          rgba(255, 255, 255, 0.09),          rgba(255, 255, 255, 0.02) 50%,          rgba(113, 234, 211, 0.08)        ),        var(--surface);      box-shadow:        0 22px 70px rgba(0, 0, 0, 0.45),        inset 0 1px 1px rgba(255, 255, 255, 0.15);      backdrop-filter: blur(20px);    }    .hero::before {      content: "";      position: absolute;      width: 230px;      height: 230px;      right: -125px;      top: -125px;      border-radius: 50%;      background: linear-gradient(        135deg,        rgba(113, 234, 211, 0.28),        rgba(98, 168, 255, 0.12)      );      filter: blur(12px);      pointer-events: none;    }    .pair-label {      position: relative;      display: flex;      align-items: center;      gap: 8px;      color: var(--muted);      font-size: 13px;      font-weight: 600;    }    .flag {      font-size: 19px;    }    .pair-arrow {      color: var(--accent);      font-size: 16px;    }    .main-rate {      position: relative;      margin-top: 15px;      font-size: clamp(46px, 15vw, 68px);      font-weight: 800;      letter-spacing: -0.08em;      line-height: 1;      background: linear-gradient(        120deg,        #ffffff 10%,        var(--accent) 50%,        var(--accent-2) 90%      );      -webkit-background-clip: text;      background-clip: text;      color: transparent;    }    .main-caption {      position: relative;      margin-top: 10px;      color: var(--muted);      font-size: 12px;    }    .hero-bottom {      position: relative;      display: flex;      align-items: end;      justify-content: space-between;      gap: 15px;      margin-top: 27px;      padding-top: 16px;      border-top: 1px solid var(--border);    }    .updated {      color: var(--muted);      font-size: 11px;    }    .updated strong {      display: block;      margin-top: 5px;      color: var(--text);      font-size: 12px;      font-weight: 600;    }    .refresh-wrap {      position: relative;      width: 58px;      height: 58px;      flex-shrink: 0;    }    .ring {      position: absolute;      inset: 0;      transform: rotate(-90deg);    }    .ring circle {      fill: none;      stroke-width: 3;    }    .ring-bg {      stroke: rgba(255, 255, 255, 0.1);    }    .ring-progress {      stroke: var(--accent);      stroke-linecap: round;      stroke-dasharray: 157;      stroke-dashoffset: 157;      filter: drop-shadow(0 0 6px rgba(113, 234, 211, 0.6));    }    .refresh-button {      position: absolute;      inset: 6px;      display: grid;      place-items: center;      border: 0;      border-radius: 50%;      background:        linear-gradient(135deg, #b2fff2, var(--accent) 45%, var(--accent-2));      color: #061412;      cursor: pointer;      box-shadow:        0 8px 24px rgba(113, 234, 211, 0.25),        inset 0 1px 1px rgba(255, 255, 255, 0.8);      transition:        transform 0.2s ease,        opacity 0.25s ease,        filter 0.25s ease;    }    .refresh-button:hover {      filter: brightness(1.1);      transform: scale(1.05);    }    .refresh-button:active {      transform: scale(0.92);    }    .refresh-button:disabled {      cursor: not-allowed;      opacity: 0.58;    }    .refresh-button svg {      width: 19px;      height: 19px;      fill: currentColor;      transform-origin: center;    }    .rotate-twice svg {      animation: rotate-twice 1.6s cubic-bezier(0.25, 1, 0.35, 1);    }    .chart-card {      margin-top: 16px;      padding: 20px 18px 16px;      border: 1px solid var(--border);      border-radius: 25px;      background:        linear-gradient(          160deg,          rgba(255, 255, 255, 0.05),          rgba(98, 168, 255, 0.03)        ),        var(--surface);      box-shadow:        0 15px 35px rgba(0, 0, 0, 0.3),        inset 0 1px 1px rgba(255, 255, 255, 0.08);      backdrop-filter: blur(16px);      transition: opacity 0.3s ease;    }    .chart-header {      display: flex;      align-items: center;      justify-content: space-between;      margin-bottom: 16px;    }    .chart-title {      font-size: 12px;      font-weight: 700;      letter-spacing: 0.08em;      text-transform: uppercase;      color: var(--muted);    }    .time-selector {      display: flex;      gap: 4px;      background: var(--surface-2);      padding: 3px;      border-radius: 12px;      border: 1px solid var(--border);    }    .time-btn {      border: none;      background: transparent;      color: var(--muted);      padding: 5px 9px;      border-radius: 8px;      font-size: 11px;      font-weight: 700;      cursor: pointer;      transition: all 0.25s ease;    }    .time-btn.active {      background: linear-gradient(135deg, rgba(113, 234, 211, 0.25), rgba(98, 168, 255, 0.15));      color: var(--accent);      box-shadow: inset 0 0 0 1px rgba(113, 234, 211, 0.4);    }    .chart-container {      position: relative;      height: 210px;      width: 100%;    }    .error {      min-height: 17px;      margin-top: 12px;      color: var(--danger);      font-size: 11px;      text-align: center;    }    .chart-flash {      animation: flash-animation 0.4s ease-in-out;    }    @keyframes flash-animation {      0% { opacity: 1; }      50% { opacity: 0.3; }      100% { opacity: 1; }    }    @keyframes rotate-twice {      0% {        transform: rotate(0deg);      }      100% {        transform: rotate(-720deg);      }    }    @media (max-width: 350px) {      body {        padding: 12px;      }      .hero {        padding: 22px 17px 19px;      }      .time-btn {        padding: 4px 6px;        font-size: 10px;      }    }  </style></head><body>  <main class="app">    <header class="header">      <div class="brand">        <div class="brand-mark">$</div>        <div>          <h1>Currency Rate</h1>          <p class="subtitle">United States Dollar / Thai Baht</p>        </div>      </div>      <div id="date" class="date">—</div>    </header>    <section class="hero">      <div class="pair-label">        <span class="flag">🇺🇸</span>        USD        <span class="pair-arrow">→</span>        <span class="flag">🇹🇭</span>        THB      </div>      <div id="mainRate" class="main-rate">—</div>      <div class="main-caption">        Thai Baht per 1 US Dollar      </div>      <div class="hero-bottom">        <div class="updated">          Last updated          <strong id="updated">—</strong>        </div>        <div class="refresh-wrap">          <svg class="ring" viewBox="0 0 58 58">            <circle class="ring-bg" cx="29" cy="29" r="25"></circle>            <circle              id="ringProgress"              class="ring-progress"              cx="29"              cy="29"              r="25"            ></circle>          </svg>          <button            id="refreshButton"            class="refresh-button"            aria-label="Refresh exchange rate"          >            <svg viewBox="0 0 24 24">              <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" />            </svg>          </button>        </div>      </div>    </section>    <section id="chartCard" class="chart-card">      <div class="chart-header">        <span class="chart-title">Market Trend</span>        <div class="time-selector">          <button class="time-btn" data-range="7d">7D</button>          <button class="time-btn active" data-range="1m">1M</button>          <button class="time-btn" data-range="6m">6M</button>          <button class="time-btn" data-range="1y">1Y</button>          <button class="time-btn" data-range="3y">3Y</button>        </div>      </div>      <div class="chart-container">        <canvas id="rateChart"></canvas>      </div>    </section>    <div id="error" class="error"></div>  </main>  <script>    const API_URL = "https://api.exchangerate.fun/latest?base=USD";    const AUTO_REFRESH_INTERVAL = 20000;    const MANUAL_COOLDOWN = 3500;    const mainRate = document.getElementById("mainRate");    const updated = document.getElementById("updated");    const date = document.getElementById("date");    const error = document.getElementById("error");    const button = document.getElementById("refreshButton");    const ringProgress = document.getElementById("ringProgress");    const timeButtons = document.querySelectorAll(".time-btn");    const chartCard = document.getElementById("chartCard");    let isLoading = false;    let cooldownFrame = null;    let chartInstance = null;    let selectedRange = "1m";    let previousChartData = null;    let previousMainRate = null;    function formatNumber(value, digits = 2) {      return new Intl.NumberFormat("en-US", {        minimumFractionDigits: digits,        maximumFractionDigits: digits      }).format(value);    }    function updateDateTime() {      const now = new Date();      date.textContent = new Intl.DateTimeFormat("en-US", {        month: "short",        day: "numeric",        year: "numeric"      }).format(now);      updated.textContent = new Intl.DateTimeFormat("en-US", {        hour: "2-digit",        minute: "2-digit",        second: "2-digit"      }).format(now);    }    async function loadRate() {      if (isLoading) return false;      isLoading = true;      error.textContent = "";      let hasRateChanged = false;      try {        const response = await fetch(API_URL, {          cache: "no-store"        });        if (!response.ok) {          throw new Error("Request failed");        }        const data = await response.json();        const rate = data?.rates?.THB;        if (typeof rate !== "number" || rate <= 0) {          throw new Error("Invalid rate");        }        const formatted = `฿${formatNumber(rate, 4)}`;        if (previousMainRate !== null && previousMainRate !== formatted) {          hasRateChanged = true;        }        previousMainRate = formatted;        mainRate.textContent = formatted;        updateDateTime();      } catch {        error.textContent = "Unable to update exchange rate";      } finally {        isLoading = false;      }      return hasRateChanged;    }    function formatDate(date) {      const y = date.getFullYear();      const m = String(date.getMonth() + 1).padStart(2, "0");      const d = String(date.getDate()).padStart(2, "0");      return `${y}-${m}-${d}`;    }    function getStartDate(range) {      const now = new Date();      if (range === "7d") now.setDate(now.getDate() - 7);      else if (range === "1m") now.setMonth(now.getMonth() - 1);      else if (range === "6m") now.setMonth(now.getMonth() - 6);      else if (range === "1y") now.setFullYear(now.getFullYear() - 1);      else if (range === "3y") now.setFullYear(now.getFullYear() - 3);      return formatDate(now);    }    function triggerChartFlash() {      chartCard.classList.remove("chart-flash");      void chartCard.offsetWidth;      chartCard.classList.add("chart-flash");      setTimeout(() => {        chartCard.classList.remove("chart-flash");      }, 400);    }    async function fetchHistoricalData(range, isManual = false, mainRateChanged = false) {      const startDate = getStartDate(range);      const url = `https://api.frankfurter.dev/v1/${startDate}..?from=USD&to=THB`;      try {        const response = await fetch(url);        if (!response.ok) throw new Error();        const data = await response.json();        const rates = data.rates;                const labels = Object.keys(rates).map(d => {          const dateObj = new Date(d);          return dateObj.toLocaleDateString("en-US", { month: "short", day: "numeric" });        });        const values = Object.values(rates).map(r => r.THB);                const currentDataString = JSON.stringify(values);        const hasDataChanged = previousChartData !== null && previousChartData !== currentDataString;        if (isManual || hasDataChanged || mainRateChanged) {          triggerChartFlash();        }        previousChartData = currentDataString;        renderChart(labels, values);      } catch {        error.textContent = "Unable to load historical data";      }    }    function renderChart(labels, data) {      const ctx = document.getElementById("rateChart").getContext("2d");            const gradient = ctx.createLinearGradient(0, 0, 0, 200);      gradient.addColorStop(0, "rgba(113, 234, 211, 0.4)");      gradient.addColorStop(1, "rgba(98, 168, 255, 0.0)");      if (chartInstance) {        chartInstance.destroy();      }      chartInstance = new Chart(ctx, {        type: "line",        data: {          labels: labels,          datasets: [{            data: data,            borderColor: "#71ead3",            borderWidth: 2.5,            fill: true,            backgroundColor: gradient,            tension: 0.35,            pointRadius: 0,            pointHoverRadius: 6,            pointHoverBackgroundColor: "#71ead3",            pointHoverBorderColor: "#080a0d",            pointHoverBorderWidth: 2          }]        },        options: {          responsive: true,          maintainAspectRatio: false,          plugins: {            legend: { display: false },            tooltip: {              mode: "index",              intersect: false,              backgroundColor: "rgba(18, 23, 29, 0.95)",              titleColor: "#8b949e",              bodyColor: "#f4f7f8",              borderColor: "rgba(255, 255, 255, 0.1)",              borderWidth: 1,              padding: 10,              displayColors: false,              callbacks: {                label: (ctx) => `฿${ctx.parsed.y.toFixed(2)} THB`              }            }          },          scales: {            x: {              grid: { display: false },              ticks: {                color: "#8b949e",                font: { size: 10 },                maxTicksLimit: 5              }            },            y: {              grid: { color: "rgba(255, 255, 255, 0.05)" },              ticks: {                color: "#8b949e",                font: { size: 10 }              }            }          }        }      });    }    function playButtonAnimation() {      button.classList.remove("rotate-twice");      void button.offsetWidth;      button.classList.add("rotate-twice");      setTimeout(() => {        button.classList.remove("rotate-twice");      }, 1600);    }    function startCooldown() {      const startTime = performance.now();      button.disabled = true;      ringProgress.style.strokeDashoffset = "157";      function animate(currentTime) {        const progress = Math.min(          (currentTime - startTime) / MANUAL_COOLDOWN,          1        );        ringProgress.style.strokeDashoffset =          String(157 - 157 * progress);        if (progress < 1) {          cooldownFrame = requestAnimationFrame(animate);        } else {          button.disabled = false;          ringProgress.style.strokeDashoffset = "157";          cooldownFrame = null;        }      }      if (cooldownFrame) {        cancelAnimationFrame(cooldownFrame);      }      cooldownFrame = requestAnimationFrame(animate);    }    async function refreshWithAnimation(isManual = false) {      if (isLoading || (isManual && button.disabled)) return;      playButtonAnimation();      startCooldown();      const rateChanged = await loadRate();      await fetchHistoricalData(selectedRange, isManual, rateChanged);    }    button.addEventListener("click", () => {      refreshWithAnimation(true);    });    timeButtons.forEach(btn => {      btn.addEventListener("click", (e) => {        timeButtons.forEach(b => b.classList.remove("active"));        e.target.classList.add("active");        selectedRange = e.target.getAttribute("data-range");        fetchHistoricalData(selectedRange, true);      });    });    loadRate();    fetchHistoricalData(selectedRange, false);    setInterval(() => {      refreshWithAnimation(false);    }, AUTO_REFRESH_INTERVAL);  </script></body></html>
